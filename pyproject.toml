[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farmnex-route-optimizer"
version = "0.2.0"
description = "Route optimization, load pooling, return-trip matching and GPS tracking for FarmNex (SIH 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["uvicorn[standard]>=0.29", "pytest>=8"]

[tool.setuptools]
packages = ["farmnex_routes"]

[tool.setuptools.package-data]
farmnex_routes = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
